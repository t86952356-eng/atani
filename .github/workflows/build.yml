name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Build JAR with Shadow
        run: ./gradlew shadowJar

      - name: Slim JAR for FCL (remove classpath-shadowed libs, lossless recompress)
        run: python tools/fcl_slim.py build/libs/atani-client-1.8.9-all.jar

      - uses: "marvinpinto/action-automatic-releases@latest"
        name: "Create release"
        if: ${{ github.event.repository.default_branch == github.ref_name && github.event.pull_request == null }}
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Build"
          files: |
            build/libs/atani-client-1.8.9-all.jar
            release/atani-client-1.8.9-all.json