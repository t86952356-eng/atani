plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'tech.atani'
version = '1.8.9'

repositories {
    maven { url "https://jitpack.io" }
    maven { url "https://maven.lenni0451.net/releases" }
    maven { url "https://repo.marcloud.net/" }
    maven { url "https://litarvan.github.io/maven" }
    maven { url "https://repo.viaversion.com" }
    maven { url "https://raw.github.com/WonderlandLibrary/wonderland-repository/main" }

    mavenCentral()
}

dependencies {
    implementation "com.github.Vatuu:discord-rpc:1.6.2"
    implementation "fr.litarvan:openauth:1.1.3"
    implementation "javax.vecmath:vecmath:1.5.2"
    implementation "org.reflections:reflections:0.10.2"
    // reflections 0.10.2's pom في المستودع المستخدم هو stub بلا تبعيات،
    // لذلك يجب التصريح عنها يدوياً وإلا انهار العميل بـ NoClassDefFoundError
    implementation "org.slf4j:slf4j-api:2.0.16"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:2.25.1"
    implementation "org.javassist:javassist:3.28.0-GA"
    implementation "de.florianmichael:RClasses:1.2.4"
    implementation "io.netty:netty-all:4.1.111.Final"
    implementation "com.mojang:patchy:1.7.7"
    implementation "net.sf.jopt-simple:jopt-simple:4.6"
    implementation "org.lwjgl:lwjgl:2.9.4-nightly"
    implementation "org.lwjgl:util:2.9.4-nightly"
    implementation "net.java.jinput:jinput:2.0.5"
    implementation "com.mojang:icu4j-core-mojang:51.2"
    implementation "org.apache.httpcomponents:httpclient:4.3.3"
    implementation "org.apache.httpcomponents:httpcore:4.3.2"
    implementation "oshi:oshi-core:1.1"
    implementation "net.java.dev.jna:jna:3.4.0"
    implementation "net.java.dev.jna:platform:3.4.0"
    implementation "net.java.jutils:jutils:1.0.0"
    implementation "commons-logging:commons-logging:1.1.3"
    implementation "org.apache.commons:commons-compress:1.8.1"

    implementation "org.apache.logging.log4j:log4j-api:2.25.1"
    implementation "org.apache.logging.log4j:log4j-core:2.25.1"

    implementation "tv.twitch:twitch:6.5"
    implementation "com.google.guava:guava:17.0"
    implementation "org.apache.commons:commons-lang3:3.3.2"
    implementation "commons-io:commons-io:2.4"
    implementation "commons-codec:commons-codec:1.9"
    implementation "com.google.code.gson:gson:2.2.4"
    implementation "com.paulscode.sound:libraryjavasound:20101123"
    implementation "com.paulscode.sound:codecwav:20101023"
    implementation "com.paulscode.sound:soundsystem:20120107"
    implementation "com.paulscode.sound:codecjorbis:20101023"
    implementation "com.paulscode.sound:librarylwjglopenal:20100824"
    implementation "com.mojang:realmsclient:1.7.59"
    implementation "com.mojang:authlib:1.5.21"
    implementation "org.openjfx:javafx-graphics:18"
    implementation "org.yaml:snakeyaml:2.0"

    // ViaVersion - libs specifically tweaked to work with ViaMCP,
    // therefore we cannot source them from elsewhere
    implementation fileTree('libs')
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks {
    shadowJar {
        manifest {
            attributes["Main-Class"] = "net.minecraft.client.main.Main"
            // مطلوب: التبعيات (log4j, snakeyaml) هي Multi-Release JARs.
            // بدون هذه الخاصية يتجاهل JVM فئات META-INF/versions/9 ويحمّل
            // نسخ Java 8 المعطلة على Java 9+، ما يسبب كراش:
            // UnsupportedOperationException in LogManager.getCallerClass
            attributes["Multi-Release"] = "true"
        }
    }
}
